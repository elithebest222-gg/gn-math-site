name: Build and Deploy PPSSPP to tools/psp

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ppsspp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone PPSSPP Web (wasm branch & all submodules)
        run: |
          git clone --branch wasm --recurse-submodules https://github.com/root-hunter/ppsspp-web temp-repo
          cd temp-repo
          git submodule update --init --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'temp-repo/.nvmrc'

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.12'

      - name: Build GitHub Pages Static Bundle
        working-directory: temp-repo
        run: |
          npm install --global npm@12.2.0
          npm --prefix wasm-page ci
          make pages WASM_ENABLE_LTO=OFF

      - name: Move Built Files to tools/psp
        run: |
          mkdir -p tools/psp
          if [ -d "temp-repo/wasm-page/dist/ppsspp-web" ]; then
            rsync -av --delete temp-repo/wasm-page/dist/ppsspp-web/ tools/psp/
          else
            echo "::error::Build output folder wasm-page/dist/ppsspp-web not found!"
            exit 1
          fi

      - name: Clean Up Temporary Workspace
        run: |
          rm -rf temp-repo

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

          git add tools/psp/
          git commit -m "Built and imported PPSSPP Web for GitHub Pages into tools/psp" || echo "No changes to commit"

          git pull --rebase origin ${{ github.ref_name }}
          git push origin ${{ github.ref_name }}
