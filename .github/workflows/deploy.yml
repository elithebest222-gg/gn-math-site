name: Import WebBloxDemo to games/rblx

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-webblox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone WebBloxDemo
        run: |
          git clone --depth 1 https://github.com/elithebest222-gg/WebBloxDemo/ temp-repo

      - name: Copy Static Files to games/rblx
        run: |
          mkdir -p games/rblx
          rsync -av --delete \
            --exclude='.git' \
            --exclude='archive' \
            --exclude='readme.md' \
            temp-repo/ games/rblx/

      - name: Clean Up Temporary Workspace
        run: |
          rm -rf temp-repo

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add games/rblx/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Imported WebBloxDemo static build into games/rblx"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          fi
