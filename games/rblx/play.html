<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GN-BLOX</title>
  <link rel="icon" href="favicon.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    .bar { height: 34px; background: #0074bd; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-weight: 700; font-size: 13px; }
    .bar a { color: #fff; text-decoration: none; background: rgba(0,0,0,0.25); padding: 3px 9px; border-radius: 2px; }
    #canvas { display: block; width: 100vw; height: calc(100vh - 34px); }
    #loading { position: fixed; inset: 34px 0 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99; }
    #loading img { width: 280px; margin-bottom: 24px; }
    #loading-text { color: #fff; font-size: 18px; }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./coi-serviceworker.js').then(() => { if (!crossOriginIsolated) location.reload(); });
    }
  </script>
</head>
<body>
  <div class="bar"><span id="gname">WebBlox</span><a href="index.html">Back to Home</a></div>
  <div id="loading"><img src="WebBlox.png" alt="" /><span id="loading-text">Loading...</span></div>
  <canvas id="canvas" oncontextmenu="return false"></canvas>
  <script>
    (function () {
      const p = new URLSearchParams(location.search);
      const mapFile = p.get('map');
      const isCustom = p.get('custom') === '1';
      document.getElementById('gname').textContent = p.get('title') || 'WebBlox';
      const loadDiv = document.getElementById('loading'), loadTxt = document.getElementById('loading-text');
      document.addEventListener('contextmenu', e => e.preventDefault());

      let loaded = 0;
      const chunksP = Promise.all(Array.from({ length: 12 }, (_, i) =>
        fetch('rblx.data.' + i).then(r => r.arrayBuffer()).then(b => {
          loaded++; loadTxt.textContent = 'Loading ' + Math.round(loaded / 12 * 100) + '%'; return b;
        })
      )).then(chunks => {
        const out = new Uint8Array(chunks.reduce((s, c) => s + c.byteLength, 0));
        let off = 0; chunks.forEach(c => { out.set(new Uint8Array(c), off); off += c.byteLength; });
        return URL.createObjectURL(new Blob([out], { type: 'application/octet-stream' }));
      });

      const placeP = isCustom && sessionStorage.getItem('customPlaceData')
        ? fetch(sessionStorage.getItem('customPlaceData')).then(r => r.arrayBuffer())
        : (mapFile ? fetch('places/' + mapFile).then(r => r.ok ? r.arrayBuffer() : null).catch(() => null) : Promise.resolve(null));

      const origFetch = window.fetch.bind(window);
      window.fetch = (res, init) => /rblx\.data$/.test(typeof res === 'string' ? res : res?.url || '')
        ? chunksP.then(u => origFetch(u, init)) : origFetch(res, init);

      window.Module = {
        canvas: document.getElementById('canvas'),
        print: () => {},
        printErr: t => { if (/error|exception/i.test(t)) console.error(t); },
        preRun: [() => {
          addRunDependency('map');
          placeP.then(buf => {
            if (buf) {
              const bytes = new Uint8Array(buf);
              const scan = d => FS.readdir(d).forEach(e => {
                if (e === '.' || e === '..') return;
                const full = (d === '/' ? '' : d) + '/' + e;
                if (FS.isDir(FS.stat(full).mode)) scan(full);
                else if (/\.rbxlx?$/i.test(e)) FS.writeFile(full, bytes);
              });
              scan('/');
            }
            removeRunDependency('map');
          });
        }],
        onRuntimeInitialized: () => { loadDiv.style.display = 'none'; }
      };
      const s = document.createElement('script'); s.src = 'rblx.js'; document.body.appendChild(s);
    })();
  </script>
</body>
</html>
