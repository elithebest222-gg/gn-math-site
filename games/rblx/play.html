<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>GN-BLOX</title>
  <link rel="icon" href="favicon.png" />
  <link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" />
  <script src="config.js"></script>
  <script src="site.js"></script>
  <script src="peerjs.min.js"></script>
  <script src="p2p.js"></script>
  <script src="vendor/fzstd.js"></script>
  <script src="rbxfile.js"></script>
  <script src="webapi.js"></script>
  <script src="touch.js"></script>
  <style>
    :root { --panel: #232527; --text: #fff; --muted: #b8b8b8; --blue: #00a2ff; --green: #02b757; --red: #d86868; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: "Source Sans Pro", "Source Sans 3", "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--text); }
    #canvas { display: block; width: 100vw; height: 100vh; background: #000; }

    /* 2016-style in-game loading screen: the game's picture, dimmed; name bottom left; spinner bottom right */
    #loading { position: fixed; inset: 0; z-index: 20; background: #3d3f41 center / cover no-repeat; overflow: hidden; }
    #loading::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(40,42,44,.72) 0%, rgba(40,42,44,.82) 55%, rgba(25,26,27,.95) 100%); }
    #loading > * { position: absolute; }
    #loading .tip { top: 18px; left: 0; right: 0; text-align: center; font-size: 15px; color: #c9c9c9; padding: 0 16px; }
    #loading .info { left: 32px; bottom: 34px; right: 140px; }
    #loading .title { font-size: clamp(24px, 3.4vw, 36px); font-weight: 400; line-height: 1.15; word-break: break-word; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
    #loading .by { margin-top: 4px; font-size: 16px; color: #d0d0d0; }
    #loading .status { margin-top: 10px; font-size: 14px; color: #a9a9a9; min-height: 18px; }
    #loading .ring { right: 34px; bottom: 30px; width: 58px; height: 58px; border-radius: 50%; border: 6px solid rgba(255,255,255,.18); border-top-color: #00a2ff; border-right-color: #00a2ff; animation: ring 1s linear infinite; }
    #loading .bar { left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.08); }
    #loading .bar i { display: block; height: 100%; width: 0; background: #00a2ff; transition: width .25s; }
    @keyframes ring { to { transform: rotate(360deg); } }

    #error { display: none; position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.7); align-items: center; justify-content: center; padding: 16px; }
    #error .box { width: min(460px, 100%); background: #fff; color: #191919; border-radius: 4px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
    #error h2 { font-size: 20px; font-weight: 600; padding: 14px 18px; border-bottom: 1px solid #e3e3e3; }
    #error p { padding: 16px 18px 6px; font-size: 16px; line-height: 1.35; }
    #error code { display: block; margin: 6px 18px 0; padding: 8px 10px; background: #f2f2f2; border-radius: 3px; font-size: 12px; color: #555; max-height: 120px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
    #error .btns { display: flex; gap: 10px; justify-content: center; padding: 18px; }
    #error button, #error a { min-width: 120px; padding: 8px 14px; border-radius: 3px; border: 1px solid transparent; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; text-align: center; }
    #error .primary { background: var(--blue); color: #fff; }
    #error .secondary { background: #fff; color: #191919; border-color: #b8b8b8; }
    #sound { position: fixed; top: 4px; left: 280px; z-index: 30; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 3px; background: rgba(0,0,0,.5); color: #fff; font: inherit; font-size: 14px; font-weight: 600; border: 1px solid rgba(255,255,255,.25); cursor: pointer; }
    #sound[hidden] { display: none; }
    #sound svg { width: 16px; height: 16px; fill: currentColor; }
    #sound:hover { background: rgba(0,0,0,.75); }
    #assets-note { position: fixed; top: 44px; left: 50%; transform: translateX(-50%); z-index: 30; width: min(560px, calc(100% - 24px)); background: rgba(25,27,29,.9);
      border: 1px solid rgba(255,255,255,.2); border-radius: 4px; padding: 10px 40px 10px 14px; font-size: 15px; line-height: 1.35; color: #fff; }
    #assets-note[hidden] { display: none; }
    #assets-note button { font: inherit; color: #00a2ff; background: none; border: 0; cursor: pointer; padding: 0; text-decoration: underline; }
    #assets-note .x { position: absolute; top: 6px; right: 10px; color: #ccc; text-decoration: none; font-size: 20px; line-height: 1; }
    #assets-note code[hidden] { display: none; }
    #assets-note code { display: block; margin-top: 6px; max-height: 90px; overflow: auto; font-size: 12px; color: #bbb; word-break: break-word; }
    @media (max-width: 600px) { #sound { left: auto; right: 8px; top: auto; bottom: 8px; } #loading .tip { display: none; } #loading .info { left: 18px; right: 96px; bottom: 26px; } #loading .ring { right: 20px; bottom: 26px; width: 46px; height: 46px; } }
  </style>
</head>
<body>
  <button id="sound" hidden title="Your browser is keeping the game quiet until you click"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>Click for sound</button>
  <div id="loading">
    <div class="tip" id="tip"></div>
    <div class="info">
      <div class="title" id="game-title">GN-BLOX</div>
      <div class="by" id="game-by">By GN-BLOX</div>
      <div class="status" id="status">Starting&hellip;</div>
    </div>
    <div class="ring" aria-label="Loading"></div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div id="error"><div class="box">
    <h2>Disconnected</h2>
    <p id="err-msg">The game stopped unexpectedly.</p>
    <code id="err-detail"></code>
    <div class="btns"><button class="primary" onclick="location.reload()">Reconnect</button><a class="secondary" href="./index.html">Leave</a></div>
  </div></div>

  <div id="assets-note" hidden><button class="x" aria-label="Close">&times;</button><span id="assets-text"></span> <button id="assets-which">Which ones?</button><code id="assets-ids" hidden></code></div>
  <canvas id="canvas" oncontextmenu="return false"></canvas>

  <script>
    try { Object.defineProperty(navigator, 'hardwareConcurrency', { get: () => 32 }); } catch (e) {}

    (async function () {
      const VERSION = '49';                       // bump when rblx.js / rblx.wasm change
      const CHUNKS = 12, CHUNK_SIZE = 25165824, DATA_SIZE = 289418733;
      const $ = id => document.getElementById(id);
      const canvas = $('canvas'), loading = $('loading');
      const params = new URLSearchParams(location.search);
      const title = params.get('title') || 'Natural Disaster Survival';
      const DEBUG = params.has('debug');           // ?debug=1 prints the engine log to the console
      const TIPS = ['Tip: hold right mouse button to turn the camera.', 'Tip: use W A S D to walk and Space to jump.',
                    'Tip: press / to chat.', 'Tip: scroll or use I / O to zoom in and out.'];

      // phones and tablets get on-screen controls (touch.js); ?touch=1 shows them anywhere
      const touchControls = window.GNTouch && (params.has('touch') || GNTouch.isTouch());
      if (touchControls) TIPS.splice(0, TIPS.length, 'Tip: the stick in the lower left walks; drag anywhere else to turn the camera.',
        'Tip: tap the arrow button to jump.', 'Tip: pinch to zoom in and out.', 'Tip: tap the chat button to talk.');
      document.title = title + ' - GN-BLOX';
      $('game-title').textContent = title;
      $('game-by').textContent = 'By ' + (params.get('by') || 'GN-BLOX');
      $('tip').textContent = TIPS[Math.floor(Math.random() * TIPS.length)];
      // the game's picture behind the loading screen (thumbs/<id>-wide.jpg)
      const gameId = (params.get('id') || (params.get('map') || params.get('custom') ? '' : 'nds')).replace(/[^a-z0-9-]/g, '');
      if (gameId) loading.style.backgroundImage = `url("thumbs/${gameId}-wide.jpg")`;

      // Graphics: how many pixels the game draws. The engine renders at the screen's pixel ratio, so a
      // high-DPI screen meant 4x the pixels and a quarter of the frame rate (and slow-motion physics).
      // It's set in the game's own menu, like 2016 Roblox (Settings: Graphics Mode and Graphics Quality,
      // see GameSettings.lua below): Automatic (the default) draws fewer pixels while the game runs
      // below 60 fps (the game reports its frame rate every 2 seconds); Manual quality 1-9 goes from 40%
      // to 100% of the page's pixels, and 10 uses the screen's full resolution.
      const realRatio = window.devicePixelRatio || 1;
      let autoScale = Math.min(realRatio, 1), smoothFor = 0;
      let gfx = 0;   // 0 = Automatic, 1-10 = Manual quality
      try {
        const saved = localStorage.getItem('webblox-graphics') || 'auto';
        gfx = ({ fast: 3, normal: 9, sharp: 10 })[saved] || (/^q(10|[1-9])$/.test(saved) ? +saved.slice(1) : 0);
      } catch (e) {}
      const gfxLevel = () => gfx;
      const pixelScale = () => gfx === 0 ? autoScale : gfx >= 10 ? realRatio : Math.min(realRatio, 1) * (0.4 + 0.6 * (gfx - 1) / 8);
      try { Object.defineProperty(window, 'devicePixelRatio', { get: pixelScale, configurable: true }); } catch (e) {}
      const setGfx = n => {
        n = Math.max(0, Math.min(10, n | 0));
        if (n === gfx) return;
        gfx = n;
        try { localStorage.setItem('webblox-graphics', n ? 'q' + n : 'auto'); } catch (e) {}
        window.dispatchEvent(new Event('resize'));
      };
      // (no resizing in the middle of a click: the engine would lose the button press)
      let lastPress = 0, pressing = false;
      addEventListener('pointerdown', () => { pressing = true; lastPress = performance.now(); }, true);
      addEventListener('pointerup', () => { pressing = false; lastPress = performance.now(); }, true);
      const autoGraphics = fps => {
        if (gfx !== 0 || !(fps > 0) || pressing || performance.now() - lastPress < 1500) return;
        const before = autoScale, top = Math.min(realRatio, 1);
        if (fps < 50) { autoScale = Math.max(0.45, autoScale * (fps < 35 ? 0.8 : 0.9)); smoothFor = 0; }
        else if (fps >= 57 && ++smoothFor >= 3 && autoScale < top) { autoScale = Math.min(top, autoScale * 1.1); smoothFor = 0; }
        if (Math.abs(autoScale - before) > 0.001) window.dispatchEvent(new Event('resize'));
      };

      // Images, meshes and sounds an uploaded game asked for that weren't uploaded with it (the
      // service worker answers those with a 404 and says so here): tell the player which ids to add.
      const missingAssets = new Set();
      let missingTimer = 0;
      try {
        new BroadcastChannel('gnblox-assets').onmessage = e => {
          const id = String((e.data || {}).missing || '');
          if (!id || missingAssets.has(id)) return;
          missingAssets.add(id);
          clearTimeout(missingTimer);
          missingTimer = setTimeout(() => {
            const ids = [...missingAssets];
            console.log('GN-BLOX: assets this game uses that weren\'t uploaded with it: ' + ids.join(', '));
            if (!params.get('custom')) return;
            $('assets-text').textContent = 'This game uses ' + ids.length + ' image' + (ids.length === 1 ? '' : 's') + ', mesh' + (ids.length === 1 ? '' : 'es') +
              ' or sound' + (ids.length === 1 ? ' that wasn\'t' : 's that weren\'t') + ' uploaded with it.';
            $('assets-ids').textContent = 'Asset ids: ' + ids.join(', ') + '. Upload the place again together with those files, each named with its id (like ' + ids[0] + '.png), or all of them in a .zip.';
            $('assets-note').hidden = false;
          }, 2500);
        };
        $('assets-which').onclick = () => { $('assets-ids').hidden = !$('assets-ids').hidden; };
        $('assets-note').querySelector('.x').onclick = () => { $('assets-note').hidden = true; };
      } catch (e) {}

      // Signals from the game's scripts (the engine posts https://webblox.signal/<message> here)
      try {
        new BroadcastChannel('webblox-page').onmessage = e => {
          const m = String(e.data || '');
          if (m === 'leave') {
            if (document.exitPointerLock) document.exitPointerLock();
            location.href = './index.html';
          } else if (m.startsWith('fps/')) {
            autoGraphics(parseFloat(m.slice(4)));
          } else if (m.startsWith('gfx/')) {
            setGfx(parseInt(m.slice(4), 10));
          } else if (m.startsWith('fullscreen/')) {
            const on = m.endsWith('/1');
            try {
              if (on && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
              else if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
            } catch (e) {}
          }
        };
      } catch (e) {}

      // The engine calls gl.getError() after every draw call. Each one makes the browser wait for the
      // GPU to finish everything so far, 25+ times a frame. Once the game is running nothing reads
      // those errors, so answer "no error" right away.
      for (const P of [window.WebGL2RenderingContext, window.WebGLRenderingContext]) {
        if (!P) continue;
        const realGetError = P.prototype.getError;
        P.prototype.getError = function () { return ready ? 0 : realGetError.call(this); };
      }

      let failed = false, ready = false, placeStarted = false;
      const custom1 = params.get('custom') === '1';
      const status = (text, pct) => {
        if (failed || ready) return;
        $('status').textContent = text;
        if (pct != null) $('bar').style.width = Math.max(0, Math.min(100, pct)) + '%';
      };
      const fail = (msg, detail) => {
        if (failed) return;
        // An uploaded place the engine rejects while loading: try once more, keeping only what the
        // 2016 engine is known to read (safe mode), before giving up.
        if (custom1 && !params.has('safe') && !ready && /deserializ|Malformed|Invalid|runtime_error|uncaught exception/i.test(detail || '')) {
          status('Trying again in safe mode…', 0);
          failed = true;
          console.warn('GN-BLOX: the place failed to load (' + detail + '), retrying in safe mode');
          location.replace(location.href + '&safe=1');
          return;
        }
        if (custom1 && placeStarted && !ready) {
          msg = 'This place couldn\'t be loaded by the 2016 engine' + (params.has('safe') ? ', even in safe mode.' : '.');
          detail = (detail || '') + ' (if it keeps happening, send this message to whoever runs this site)';
        }
        failed = true;
        try { if (document.pointerLockElement) document.exitPointerLock(); } catch (e) {}
        $('err-msg').textContent = msg;
        $('err-detail').textContent = detail || '';
        $('err-detail').style.display = detail ? 'block' : 'none';
        $('error').style.display = 'flex';
      };
      // Browsers keep a page's audio paused until you click or press a key. The engine resumes it
      // then; until it does, offer a button (any click works, this one just says so).
      const soundBtn = $('sound');
      const updateSound = () => { soundBtn.hidden = !(ready && window.__wbAudio && window.__wbAudio.state !== 'running'); };
      const RealAudioContext = window.AudioContext || window.webkitAudioContext;
      if (RealAudioContext) {
        const Tracked = function (...args) {
          const ac = new RealAudioContext(...args);
          window.__wbAudio = ac;
          ac.addEventListener('statechange', updateSound);
          updateSound();
          return ac;
        };
        Tracked.prototype = RealAudioContext.prototype;
        window.AudioContext = Tracked;
        if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
      }
      soundBtn.addEventListener('click', () => { if (window.__wbAudio) window.__wbAudio.resume().then(updateSound, updateSound); canvas.focus(); });
      const show = () => {
        if (ready || failed) return;
        ready = true;
        setTimeout(updateSound, 300);
        $('bar').style.width = '100%';
        setTimeout(() => { loading.style.display = 'none'; canvas.focus(); if (touchControls) GNTouch.start(canvas); }, 250);
      };
      window.addEventListener('error', e => {
        if (/ResizeObserver|PeerJS/i.test(e.message || '')) return;
        fail('The game stopped unexpectedly.', e.message || String(e.error || ''));
      });
      canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); fail('Your graphics card stopped responding (WebGL context lost).'); });

      // SharedArrayBuffer needs cross-origin isolation; GitHub Pages can't send the headers, so a
      // service worker adds them and we reload once it controls the page.
      if (!window.crossOriginIsolated && 'serviceWorker' in navigator) {
        status('Preparing game engine…', 0);
        try {
          const reg = await navigator.serviceWorker.register('./coi-serviceworker.js');
          const sw = reg.installing || reg.waiting;
          if (sw && sw.state !== 'activated') await new Promise(r => sw.addEventListener('statechange', () => sw.state === 'activated' && r()));
          if (!sessionStorage.getItem('coiReloaded')) { sessionStorage.setItem('coiReloaded', '1'); return location.reload(); }
        } catch (e) { /* fall through to the check below */ }
      }
      sessionStorage.removeItem('coiReloaded');
      if (!window.SharedArrayBuffer) {
        return fail('This browser can\'t run GN-BLOX here.', 'SharedArrayBuffer is unavailable (the page is not cross-origin isolated). Try reloading, or use a recent Chrome, Edge or Firefox outside private/incognito mode.');
      }

      // The Roblox web services the game's scripts call (DataStores, game passes, groups...) are
      // answered by this page (webapi.js); each game's DataStores are kept on this device.
      try { GNWebApi.start({ game: String(params.get('map') || (params.get('custom') ? 'custom:' + title : 'natural-disaster-survival.rbxl')), debug: DEBUG }); }
      catch (e) { console.warn('GN-BLOX web API unavailable:', e); }

      // Multiplayer: a server from config.js (tools/multiplayer-server) if one is set, otherwise
      // peer-to-peer over PeerJS (p2p.js), started now so it connects while the game downloads.
      const mp = multiplayerSettings();
      if (mp.mode === 'p2p') {
        // your account ID (if you're logged in) for owner / moderator commands and tags
        const W = window.WB || {};
        const me = W.identity && W.identity();
        const identity = me ? { pub: me.pub, sign: W.sign } : null;
        const onKick = info => {
          const by = info.by ? ' by ' + info.by : '';
          const why = info.reason ? 'Reason: ' + info.reason : '';
          if (info.ban) fail('You are banned from this game' + by + '.', [why, 'You can play it again ' + (info.until ? new Date(info.until).toLocaleString() : 'tomorrow') + '.'].filter(Boolean).join(' '));
          else fail('You were kicked from this server' + by + '.', why);
        };
        try { WebBloxP2P.start({ room: mp.room, sid: mp.sid, peer: mp.peer, server: +params.get('ps') || 1, identity, verify: W.verify, roleOf: W.roleOf, onKick }); }
        catch (e) { console.warn('Multiplayer unavailable:', e); mp.url = ''; }
      }

      // Warm the HTTP cache for the engine while the game data downloads.
      fetch('rblx.js?v=' + VERSION).catch(() => {});
      fetch('rblx.wasm?v=' + VERSION).catch(() => {});
      // Client scripts: default character animations (the engine never runs the character's
      // Animate script), and the Catalog outfit + lite multiplayer.
      const roleIcons = {};
      const iconsP = Promise.all([['gn-owner.png', 'gn-icon.png'], ['gn-mod.png', 'gn-mod-icon.png']].map(([file, src]) =>
        fetch(src).then(r => r.ok ? r.arrayBuffer() : null).then(b => { if (b) roleIcons[file] = new Uint8Array(b); }).catch(() => {})));
      const luaP = Promise.all(['WebBloxAnimate', 'WebBloxPlayers'].map(n =>
        fetch('scripts/' + n + '.lua?v=' + VERSION).then(r => r.ok ? r.text() : null).catch(() => null))).then(r => iconsP.then(() => r));

      // The place to load: an uploaded file (IndexedDB) or one of places/. Without either it's the
      // built-in Natural Disaster Survival, from places/ too: that copy runs its rounds on the room's
      // shared clock (tools/nds_sync.py), so everyone in a server gets the same map and disaster.
      const placeP = (async () => {
        let bytes = null;
        if (custom1) {
          bytes = await readUpload();
          if (!bytes) throw new Error('The uploaded place could not be found. Upload it again from the home page.');
          return convertUpload(bytes);
        } else if (params.get('map')) {
          const res = await fetch('places/' + encodeURIComponent(params.get('map')));
          if (!res.ok) throw new Error('Missing places/' + params.get('map') + ' (HTTP ' + res.status + ')');
          bytes = new Uint8Array(await res.arrayBuffer());
        } else {
          // (falls back to the engine's own copy if this is missing)
          const res = await fetch('places/natural-disaster-survival.rbxl').catch(() => null);
          if (res && res.ok) bytes = new Uint8Array(await res.arrayBuffer());
        }
        if (bytes && !isBinaryPlace(bytes)) {
          // Very old XML places sometimes have FogEnd = 0, which fogs out the whole world.
          bytes = new TextEncoder().encode(new TextDecoder().decode(bytes).replace(/<float name="FogEnd">0(\.0+)?<\/float>/g, '<float name="FogEnd">100000</float>'));
        }
        return bytes;
      })();

      // Game data: 12 chunks written straight into one buffer (no second 290 MB copy). They're kept
      // on this device (Cache Storage) after the first visit, so later visits skip the download.
      const data = new Uint8Array(DATA_SIZE);
      const got = new Array(CHUNKS).fill(0);
      const DATA_CACHE = 'webblox-data-' + DATA_SIZE;
      const store = await (async () => {
        try {
          if (!window.caches) return null;
          for (const k of await caches.keys()) if (k.startsWith('webblox-data-') && k !== DATA_CACHE) caches.delete(k);
          return await caches.open(DATA_CACHE);
        } catch (e) { return null; }
      })();
      let fromDisk = 0;
      const dataP = Promise.all(Array.from({ length: CHUNKS }, async (_, i) => {
        const url = new URL('rblx.data.' + i, location.href).href;
        let res = null;
        try { res = store && await store.match(url); } catch (e) {}
        if (res) fromDisk++;
        else {
          res = await fetch(url);
          if (!res.ok) throw new Error('HTTP ' + res.status + ' on rblx.data.' + i);
          if (store) { const copy = res.clone(); store.put(url, copy).catch(() => {}); }
        }
        const reader = res.body.getReader();
        let off = i * CHUNK_SIZE;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          data.set(value, off); off += value.length; got[i] += value.length;
          const sum = got.reduce((a, b) => a + b, 0);
          status((fromDisk === CHUNKS ? 'Loading game files… ' : 'Downloading game files… ') + Math.floor(sum / 1048576) + ' / ' + Math.round(DATA_SIZE / 1048576) + ' MB', sum / DATA_SIZE * 80);
        }
      }));

      let custom, results;
      try {
        results = await Promise.all([placeP, dataP, luaP]);
      } catch (e) {
        return fail('Couldn\'t download the game.', e.message);
      }
      custom = results[0];
      const [animateSource, playersSource] = results[2];
      status('Starting game engine…', 84);

      window.Module = {
        canvas,
        locateFile: p => p === 'rblx.wasm' ? 'rblx.wasm?v=' + VERSION : p,
        getPreloadedPackage: name => name.endsWith('rblx.data') ? data.buffer : null,
        print: t => {
          if (DEBUG) console.log(t);
          if (ready) return;
          if (t.includes('loading verification place')) { placeStarted = true; status(custom && !isBinaryPlace(custom) ? 'Loading place… (XML places can take a minute)' : 'Loading place…', 92); }
          else if (t.includes('gameLoaded signaled') || t.includes('verification place loaded')) show();
        },
        printErr: t => {
          if (DEBUG) console.warn(t);
          // An exception that escapes the engine thread ends the game.
          if (/sent an error!|uncaught exception|^Aborted|out of memory/i.test(t)) fail('The game stopped unexpectedly.', t.split('\n')[0]);
        },
        onAbort: what => fail('The game stopped unexpectedly.', String(what)),
        setStatus: () => {},
        onRuntimeInitialized: () => {
          if (custom) {
            try { FS.writeFile('/content/game.rbxl', custom); }
            catch (e) { fail('Couldn\'t open the place file.', e.message); }
          }
          // Run the client scripts inside the engine's StarterScript, which always runs on the client.
          try {
            const starter = '/content/scripts/StarterScript.lua';
            const marker = 'local RobloxGui = game:GetService("CoreGui"):WaitForChild("RobloxGui")';
            const src = FS.readFile(starter, { encoding: 'utf8' });
            let inject = '\n-- GN-BLOX client scripts\n' + webbloxLua() + '\n';
            for (const code of [animateSource, playersSource]) if (code) inject += 'spawn(function()\n' + code + '\nend)\n';
            FS.writeFile(starter, src.includes(marker) ? src.replace(marker, marker + inject) : src + inject);
          } catch (e) { console.warn('GN-BLOX client scripts unavailable:', e); }
          const role = myRole();
          const holders = { __WEBBLOX_NAME__: '"' + playerName() + '"', __WEBBLOX_GFX__: String(gfxLevel()), __WEBBLOX_FULLSCREEN__: document.fullscreenElement ? 'true' : 'false',
            __WEBBLOX_TAG__: role === 'owner' ? '"[Owner] "' : role === 'mod' ? '"[Mod] "' : '""',
            __WEBBLOX_ROLEICON__: role === 'owner' ? '"rbxasset://textures/ui/gn-owner.png"' : role === 'mod' ? '"rbxasset://textures/ui/gn-mod.png"' : '""' };
          // the GN logo for owner / moderator tags
          for (const [file, bytes] of Object.entries(roleIcons)) if (bytes) { try { FS.writeFile('/content/textures/ui/' + file, bytes); } catch (e) {} }
          for (const [file, list] of Object.entries(CORE_EDITS)) {
            try {
              let src = FS.readFile(file, { encoding: 'utf8' });
              for (const [from, to] of list) {
                if (src.split(from).length !== 2) throw new Error('engine script changed: ' + from.slice(0, 40));
                src = src.replace(from, () => Object.entries(holders).reduce((t, [k, v]) => t.split(k).join(v), to));
              }
              FS.writeFile(file, src);
            } catch (e) { console.warn('GN-BLOX: left ' + file + ' unchanged:', e.message); }
          }
          status('Loading place…', 88);
          setTimeout(show, placeStarted ? 120000 : 90000);
        }
      };
      const s = document.createElement('script');
      s.src = 'rblx.js?v=' + VERSION;
      s.onerror = () => fail('Couldn\'t download the game engine.', 'rblx.js failed to load');
      document.body.appendChild(s);

      // GN-BLOX: the player list also shows the other players in your multiplayer room, and you
      // appear under your GN-BLOX name (the engine names every local player "Player"). Leave Game
      // in the menu takes you home, and chat (yours and other players') shows in the chat window.
      // Settings has 2016's Graphics Mode / Graphics Quality and Fullscreen on every computer.
      // Each edit must match the engine's script exactly once, or that script is left alone.
      const CORE_EDITS = {
        '/content/scripts/Modules/PlayerlistModule.lua': [
          ["local function getMembershipIcon(player)\n\tif isTenFootInterface then",
           "local function getMembershipIcon(player)\n\t-- GN-BLOX: the owner and moderators get the GN logo (other players are Folders named \"[Owner] Name\")\n\tif not player:IsA(\"Player\") then\n\t\tlocal role = string.match(player.Name, \"^%[(%a+)%] \")\n\t\treturn (role == \"Owner\" and \"rbxasset://textures/ui/gn-owner.png\") or (role == \"Mod\" and \"rbxasset://textures/ui/gn-mod.png\") or \"\"\n\tend\n\tif player == Player and __WEBBLOX_ROLEICON__ ~= \"\" then return __WEBBLOX_ROLEICON__ end\n\tif isTenFootInterface then"],
          ["\tspawn(function()\n\t\tlocal success, result = pcall(function()\n\t\t\treturn player:GetRankInGroup(game.CreatorId) == 255",
           "\tspawn(function()\n\t\tif not player:IsA(\"Player\") then return end\n\t\tlocal success, result = pcall(function()\n\t\t\treturn player:GetRankInGroup(game.CreatorId) == 255"],
          ["if selectedPlayer ~= Player and selectedPlayer.userId > 1 and Player.userId > 1 then",
           "if selectedPlayer ~= Player and selectedPlayer:IsA(\"Player\") and selectedPlayer.userId > 1 and Player.userId > 1 then"],
          ["\t\t\tif player.Neutral then\n\t\t\t\ttable.insert(teams.Neutral, playerEntry)",
           "\t\t\tif not player:IsA(\"Player\") or player.Neutral then\n\t\t\t\ttable.insert(teams.Neutral, playerEntry)"],
          ["local team = player.Neutral and 'Neutral' or tostring(player.TeamColor)",
           "local team = (not player:IsA(\"Player\") or player.Neutral) and 'Neutral' or tostring(player.TeamColor)"],
          ["\t\tlocal userId = tostring(player.userId)\n\n\t\t-- don't update icon if already friends",
           "\t\tlocal userId = player:IsA(\"Player\") and tostring(player.userId) or \"\"\n\n\t\t-- don't update icon if already friends"],
          ["local function createPlayerEntry(player, isTopStat)\n\tlocal playerEntry = {}\n\tlocal name = player.Name",
           "local function createPlayerEntry(player, isTopStat)\n\tlocal playerEntry = {}\n\tlocal name = (player == Player and __WEBBLOX_NAME__) or string.gsub(player.Name, \"^%[%a+%] \", \"\")"],
          ["for _,player in pairs(Players:GetPlayers()) do\n\tinsertPlayerEntry(player)\nend\n",
           "for _,player in pairs(Players:GetPlayers()) do\n\tinsertPlayerEntry(player)\nend\n-- GN-BLOX: the other players in this multiplayer room (Folders with their leaderstats, kept up\n-- to date by WebBloxPlayers.lua in ReplicatedStorage.WebBlox.Players)\nspawn(function()\n\tlocal remote = game:GetService(\"ReplicatedStorage\"):WaitForChild(\"WebBlox\"):WaitForChild(\"Players\")\n\tlocal function add(child) if child:IsA(\"Folder\") then insertPlayerEntry(child) end end\n\tremote.ChildAdded:connect(add)\n\tremote.ChildRemoved:connect(function(child) removePlayerEntry(child) end)\n\tfor _, child in pairs(remote:GetChildren()) do add(child) end\nend)\n"]
        ],
        '/content/scripts/Modules/Settings/Pages/LeaveGame.lua': [
          ["\tthis.LeaveGameButton:SetVerb(\"Exit\")\n",
           "\t-- GN-BLOX: leaving goes back to the GN-BLOX home page (play.html listens for this signal)\n\tthis.LeaveGameButton.MouseButton1Click:connect(function()\n\t\tspawn(function() pcall(function() game:HttpGetAsync(\"https://webblox.signal/leave\") end) end)\n\tend)\n"]
        ],
        '/content/scripts/Modules/Chat.lua': [
          ["\t\t\tplayerName = (this.SendingPlayer and this.SendingPlayer.Name or \"\")\n\t\tend\n\t\treturn \"[\" ..  playerName .. \"]:\"",
           "\t\t\tplayerName = (this.SendingPlayer and this.SendingPlayer.Name or \"\")\n\t\t\tif this.SendingPlayer == Player then playerName = __WEBBLOX_TAG__ .. __WEBBLOX_NAME__ end\n\t\tend\n\t\t-- GN-BLOX: \"[Owner] Name\" shows as [Owner] [Name]:\n\t\tlocal tag, rest = string.match(playerName, \"^(%[%a+%]) (.*)$\")\n\t\tif tag then return tag .. \" [\" .. rest .. \"]:\" end\n\t\treturn \"[\" ..  playerName .. \"]:\""],
          ["\tlocal ChatInstance = CreateChat()\n\tChatInstance:Initialize()\n",
           "\tlocal ChatInstance = CreateChat()\n\tChatInstance:Initialize()\n\t-- GN-BLOX: your chat and other players' chat (from WebBloxPlayers.lua) go in this window\n\tspawn(function()\n\t\tlocal ev = game:GetService(\"ReplicatedStorage\"):WaitForChild(\"WebBlox\"):WaitForChild(\"ChatMessage\")\n\t\tev.Event:connect(function(name, text)\n\t\t\tif ChatInstance.ChatWindowWidget then\n\t\t\t\tpcall(function()\n\t\t\t\t\tChatInstance.ChatWindowWidget:AddChatMessage(Enum.PlayerChatType.All, { Name = tostring(name), Neutral = true, TeamColor = BrickColor.new(\"White\") }, tostring(text), nil)\n\t\t\t\tend)\n\t\t\tend\n\t\tend)\n\tend)\n"]
        ],
        '/content/scripts/Modules/Settings/Pages/GameSettings.lua': [
          ["\tif platform == Enum.Platform.Windows or platform == Enum.Platform.OSX then\n\t\tcreateGraphicsOptions()\n\tend\n",
           "\t-- GN-BLOX: graphics options on every computer (play.html scales the picture to match)\n\tcreateGraphicsOptions()\n"],
          ["\t\tlocal fullScreenInit = 1\n\t\tif not GameSettings:InFullScreen() then\n\t\t\tfullScreenInit = 2\n\t\tend\n",
           "\t\tlocal fullScreenInit = __WEBBLOX_FULLSCREEN__ and 1 or 2\n"],
          ["\t\tthis.FullscreenEnabler.IndexChanged:connect(function(newIndex)\n\t\t\tGuiService:ToggleFullscreen()\n\t\tend)\n",
           "\t\tthis.FullscreenEnabler.IndexChanged:connect(function(newIndex)\n\t\t\t-- GN-BLOX: the page goes fullscreen (or back)\n\t\t\tspawn(function() pcall(function() game:HttpGetAsync(\"https://webblox.signal/fullscreen/\" .. (newIndex == 1 and \"1\" or \"0\")) end) end)\n\t\tend)\n"],
          ["\t\tfunction SetGraphicsQuality(newValue, automaticSettingAllowed)\n",
           "\t\t-- GN-BLOX: tell the page (it draws fewer or more pixels: Automatic follows the frame rate)\n\t\tlocal wbGfxReady = false\n\t\tlocal function wbGfx(v)\n\t\t\tif not wbGfxReady then return end\n\t\t\tspawn(function() pcall(function() game:HttpGetAsync(\"https://webblox.signal/gfx/\" .. tostring(math.floor(tonumber(v) or 0))) end) end)\n\t\tend\n\t\tfunction SetGraphicsQuality(newValue, automaticSettingAllowed)\n"],
          ["\t\t\tGameSettings.SavedQualityLevel = newValue\n\t\t\tsettings().Rendering.QualityLevel = newQualityLevel\n\t\tend\n",
           "\t\t\tGameSettings.SavedQualityLevel = newValue\n\t\t\tsettings().Rendering.QualityLevel = newQualityLevel\n\t\t\twbGfx(newValue)\n\t\tend\n"],
          ["\t\t-- initialize the slider position\n\t\tif GameSettings.SavedQualityLevel == Enum.SavedQualitySetting.Automatic then\n\t\t\tthis.GraphicsQualitySlider:SetValue(5)\n\t\t\tthis.GraphicsQualityEnabler:SetSelectionIndex(1)\n\t\telse\n\t\t\tlocal graphicsLevel = tostring(GameSettings.SavedQualityLevel)\n\t\t\tif GRAPHICS_QUALITY_TO_INT[graphicsLevel] then\n\t\t\t\tgraphicsLevel = GRAPHICS_QUALITY_TO_INT[graphicsLevel]\n\t\t\telse\n\t\t\t\tgraphicsLevel = GRAPHICS_QUALITY_LEVELS\n\t\t\tend\n\n\t\t\tspawn(function()\n\t\t\t\tthis.GraphicsQualitySlider:SetValue(graphicsLevel)\n\t\t\t\tthis.GraphicsQualityEnabler:SetSelectionIndex(2)\n\t\t\tend)\n\t\tend\n",
           "\t\t-- initialize the slider position (GN-BLOX: from the setting saved on this device)\n\t\tif __WEBBLOX_GFX__ == 0 then\n\t\t\tthis.GraphicsQualitySlider:SetValue(5)\n\t\t\tthis.GraphicsQualityEnabler:SetSelectionIndex(1)\n\t\t\tsetGraphicsToAuto()\n\t\telse\n\t\t\tspawn(function()\n\t\t\t\tthis.GraphicsQualitySlider:SetValue(__WEBBLOX_GFX__)\n\t\t\t\tthis.GraphicsQualityEnabler:SetSelectionIndex(2)\n\t\t\tend)\n\t\tend\n\t\tdelay(2, function() wbGfxReady = true end)\n"]
        ],
        '/content/scripts/CoreScripts/Topbar.lua': [
          ["\t\tText = Player.Name;\n",
           "\t\tText = __WEBBLOX_NAME__;\n"]
        ]
      };

      // Any Roblox place or model -> the binary format the 2016 engine reads (rbxfile.js): XML is
      // read here instead of by the engine (which takes minutes on big places), and newer files get
      // their Zstd chunks, exact part colors, 64-bit numbers, WeldConstraints and so on converted.
      async function convertUpload(bytes) {
        try {
          const typemap = await (await fetch('tools/typemap.json?v=' + VERSION)).json();
          const t0 = performance.now();
          const doc = RBXFile.read(bytes);
          const notes = RBXFile.toEngine(doc, typemap, { safe: params.has('safe') });
          const out = RBXFile.write(doc);
          console.log('GN-BLOX: converted the place (' + doc.format + ', ' + doc.insts.length + ' objects, ' +
            Math.round(performance.now() - t0) + ' ms' + (params.has('safe') ? ', safe mode' : '') + ')' + (notes.length ? ': ' + notes.join('; ') : ''));
          return out;
        } catch (e) {
          console.warn('GN-BLOX: couldn\'t convert the place, giving it to the engine as it is:', e);
          if (!isBinaryPlace(bytes)) bytes = new TextEncoder().encode(new TextDecoder().decode(bytes).replace(/<float name="FogEnd">0(\.0+)?<\/float>/g, '<float name="FogEnd">100000</float>'));
          return bytes;
        }
      }

      function isBinaryPlace(b) { return b.length > 8 && String.fromCharCode(...b.subarray(0, 8)) === '<roblox!'; }

      // Which multiplayer room this game is in, and how to reach it: 'server' (config.multiplayerServer),
      // 'p2p' (PeerJS, the default) or 'off'. ?room=CODE makes it a private server.
      function multiplayerSettings() {
        const cfg = window.WEBBLOX_CONFIG || {};
        const code = String(params.get('room') || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12);
        const slug = String(params.get('map') || (params.get('custom') ? 'custom-' + title : 'natural-disaster-survival'))
          .toLowerCase().replace(/\.rbxlx?$/, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'game';
        const room = code ? 'priv-' + code + '-' + slug : 'pub-' + slug;
        const off = { mode: 'off', url: '', room, code };
        if (cfg.multiplayer === false) return off;
        const server = String(params.get('server') || cfg.multiplayerServer || '').replace(/\/+$/, '');
        if (/^https?:\/\/[A-Za-z0-9.\-]+(:\d+)?(\/[A-Za-z0-9._\-\/]*)?$/.test(server)) return { mode: 'server', url: server, room, code };
        // Peer-to-peer needs PeerJS and the service worker (it passes the game's requests to this page).
        if (!window.Peer || !window.WebBloxP2P || !window.BroadcastChannel || !navigator.serviceWorker || !navigator.serviceWorker.controller) return off;
        const sid = Array.from(crypto.getRandomValues(new Uint8Array(10)), b => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');
        const base = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');
        // PeerJS's free cloud introduces players to each other; config.peerServer / ?peerserver= picks another.
        const peer = WebBloxP2P.peerOptions(params.get('peerserver') || cfg.peerServer);
        return { mode: 'p2p', url: /^[A-Za-z0-9.:\/_\-]+$/.test(base) ? base + 'peer-sync/' + sid : '', room, code, sid, peer };
      }

      // Your site role (config.js owners / mods), for your own [Owner] / [Mod] tag and icon. Other
      // players only see a tag once your account's signature checks out (p2p.js).
      function myRole() { try { return (window.WB && WB.role && WB.role()) || null; } catch (e) { return null; } }

      // Your name in games: the one set on the home page, or a random Guest name for this visit.
      let nameCache = null;
      function playerName() {
        if (nameCache) return nameCache;
        let saved = '';
        try { saved = localStorage.getItem('webblox-name') || ''; } catch (e) {}
        return nameCache = saved.replace(/[^A-Za-z0-9_ ]/g, '').trim().slice(0, 20) || 'Guest ' + (1000 + Math.floor(Math.random() * 9000));
      }

      // Settings handed to the client scripts as a Lua table (WEBBLOX): multiplayer address and room,
      // your name, and the outfit you wear from the Catalog. Everything is sanitized to plain chars.
      function webbloxLua() {
        const str = (s, re) => '"' + String(s == null ? '' : s).replace(re || /[^A-Za-z0-9 _.\-]/g, '') + '"';
        const int = n => (Number.isInteger(+n) && +n > 0 && +n < 100000) ? String(+n) : 'nil';
        const store = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
        let outfit = {};
        try { outfit = JSON.parse(store('webblox-outfit')) || {}; } catch (e) {}
        const name = playerName();
        const id = Array.from(crypto.getRandomValues(new Uint8Array(10)), b => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');
        // hats and gear as parts (site.js), the same ones the website draws in 3D
        const lua = v => Array.isArray(v) ? '{' + v.map(lua).join(',') + '}'
          : v && typeof v === 'object' ? '{' + Object.entries(v).filter(([k]) => /^[A-Za-z][A-Za-z0-9]*$/.test(k)).map(([k, x]) => k + '=' + lua(x)).join(',') + '}'
          : typeof v === 'number' ? (Number.isFinite(v) ? String(v) : '0')
          : typeof v === 'boolean' ? String(v) : str(v);
        const W = window.WB || {};
        const gear = {};
        for (const [k, g] of Object.entries(W.GEAR || {})) gear[k] = Object.assign({ name: ((W.ITEMS || []).find(i => i.value === k) || {}).name || k }, g);
        const carried = (Array.isArray(outfit.gear) ? outfit.gear : []).filter(g => gear[g]);
        return 'local WEBBLOX = {\n' +
          '  mp = { url = ' + str(mp.url, /[^A-Za-z0-9.:\/_\-]/g) + ', room = ' + str(mp.room) + ', name = ' + str(name) + ', id = ' + str(id) + ', private = ' + (mp.code ? 'true' : 'false') + ' },\n' +
          '  role = ' + (myRole() ? str(myRole(), /[^a-z]/g) : 'nil') + ',\n' +
          '  look = { skin = ' + int(outfit.skin) + ', shirt = ' + int(outfit.shirt) + ', pants = ' + int(outfit.pants) + ', hat = ' + (outfit.hat ? str(outfit.hat, /[^a-z]/g) : 'nil') + ', gear = ' + lua(carried) +
            // faces and clothes from the Catalog: asset ids (the service worker serves catalog/assets/<id>.png)
            ['face', 'shirtTex', 'pantsTex'].map(k => ', ' + k + ' = ' + (/^\d{1,20}$/.test(String(outfit[k] || '')) ? str(String(outfit[k])) : 'nil')).join('') + ' },\n' +
          '  hats = ' + lua(W.HATS || {}) + ',\n' +
          '  gear = ' + lua(gear) + ',\n' +
          '}';
      }

      function readUpload() {
        return new Promise(resolve => {
          try {
            const req = indexedDB.open('webblox', 1);
            req.onupgradeneeded = () => req.result.createObjectStore('files');
            req.onerror = () => resolve(null);
            req.onsuccess = () => {
              try {
                const get = req.result.transaction('files').objectStore('files').get('upload');
                get.onsuccess = () => resolve(get.result ? new Uint8Array(get.result) : null);
                get.onerror = () => resolve(null);
              } catch (e) { resolve(null); }
            };
          } catch (e) { resolve(null); }
        });
      }
    })();
  </script>
</body>
