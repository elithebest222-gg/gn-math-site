<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>GN-BLOX Player</title>
  <link rel="icon" href="favicon.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #home-btn {
      position: fixed; top: 8px; right: 12px; z-index: 99999;
      background: #0074bd; color: #fff; text-decoration: none;
      padding: 5px 12px; border-radius: 3px; font-size: 12px; font-weight: 700;
      border: 1px solid rgba(255,255,255,0.35); cursor: pointer;
    }
    #warn-banner {
      display: none; position: fixed; top: 8px; left: 12px; z-index: 99999;
      background: rgba(180, 30, 30, 0.92); color: #fff; padding: 6px 12px;
      border-radius: 3px; font-size: 12px; font-weight: 700; max-width: 75%;
    }
    #canvas-wrap { width: 100vw; height: 100vh; background: #000; }
    #canvas { display: block; width: 100vw; height: 100vh; background: #000; }
    #loading { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; padding: 16px; text-align: center; }
    #loading img { width: 220px; margin-bottom: 20px; }
    #loading-text { color: #fff; font-size: 17px; margin-bottom: 8px; }
    #sub-text { color: #aaa; font-size: 12px; max-width: 90%; word-break: break-word; }
  </style>
  <script>
    // Prevent rblx.js from spawning 64+ pthreads and crashing Chromebook RAM
    try {
      Object.defineProperty(navigator, 'hardwareConcurrency', { get: () => 4 });
    } catch (e) {}
  </script>
  <script src="./coi-serviceworker.js"></script>
</head>
<body>
  <div id="warn-banner"></div>
  <a id="home-btn" href="./index.html" onclick="if(document.exitPointerLock)document.exitPointerLock();">Home</a>
  <div id="loading"><img src="WebBlox.png" alt="" /><span id="loading-text">Loading...</span><span id="sub-text"></span></div>
  <div id="canvas-wrap"><canvas id="canvas" oncontextmenu="return false"></canvas></div>
  <script>
    (async function () {
      const loadDiv = document.getElementById('loading');
      const loadTxt = document.getElementById('loading-text');
      const subTxt = document.getElementById('sub-text');
      const warnEl = document.getElementById('warn-banner');
      const warn = (msg) => { warnEl.textContent = msg; warnEl.style.display = 'block'; };

      // Wait for Cross-Origin Isolation
      if (!window.crossOriginIsolated && 'serviceWorker' in navigator) {
        loadTxt.textContent = 'Initializing...';
        const reg = await navigator.serviceWorker.register('./coi-serviceworker.js');
        if (reg.installing || reg.waiting) {
          await new Promise(resolve => {
            const sw = reg.installing || reg.waiting;
            sw.addEventListener('statechange', () => { if (sw.state === 'activated') resolve(); });
          });
        }
        if (!window.crossOriginIsolated) {
          location.reload();
          return;
        }
      }

      const p = new URLSearchParams(location.search);
      const mapFile = p.get('map');
      const isCustom = p.get('custom') === '1';
      if (p.get('title')) document.title = p.get('title') + ' - GN-BLOX';
      document.addEventListener('contextmenu', e => e.preventDefault());

      function prepareRbxl(bytes) {
        if (!bytes || bytes.byteLength < 16) return null;
        const head = new TextDecoder().decode(bytes.subarray(0, 32));
        if (head.includes('<roblox') && !head.startsWith('<roblox!')) {
          let xml = new TextDecoder().decode(bytes);
          xml = xml.replace(/<float name="FogEnd">0(\.0+)?<\/float>/g, '<float name="FogEnd">100000</float>');
          return new TextEncoder().encode(xml);
        }
        return bytes;
      }

      const mapPromise = (async () => {
        if (isCustom && sessionStorage.getItem('customPlaceData')) {
          const buf = await (await fetch(sessionStorage.getItem('customPlaceData'))).arrayBuffer();
          return prepareRbxl(new Uint8Array(buf));
        }
        if (mapFile) {
          try {
            const res = await fetch('places/' + encodeURIComponent(mapFile));
            if (res.ok) return prepareRbxl(new Uint8Array(await res.arrayBuffer()));
            warn('Missing places/' + mapFile + ' (HTTP ' + res.status + ')');
          } catch (e) { warn('Failed to load ' + mapFile); }
        }
        return null;
      })();

      let loaded = 0;
      const chunksP = Promise.all(Array.from({ length: 12 }, (_, i) =>
        fetch('rblx.data.' + i).then(r => {
          if (!r.ok) throw new Error('Missing rblx.data.' + i);
          return r.arrayBuffer();
        }).then(b => {
          loaded++;
          const pct = Math.round(loaded / 12 * 100);
          loadTxt.textContent = pct < 100 ? 'Loading ' + pct + '%' : 'Starting engine...';
          return b;
        })
      )).then(chunks => {
        const totalBytes = chunks.reduce((s, c) => s + c.byteLength, 0);
        const out = new Uint8Array(totalBytes);
        let off = 0;
        for (let i = 0; i < chunks.length; i++) {
          out.set(new Uint8Array(chunks[i]), off);
          off += chunks[i].byteLength;
          chunks[i] = null;
        }
        return out.buffer;
      });

      const [customBytes, packageBuffer] = await Promise.all([mapPromise, chunksP]);

      window.Module = {
        canvas: document.getElementById('canvas'),
        print: () => {},
        printErr: t => { if (/error|exception|abort/i.test(t)) console.error('[rblx]', t); },
        // Feed the stitched ArrayBuffer directly to rblx.js without Blob URL overhead
        getPreloadedPackage: (remoteName, remoteSize) => {
          if (remoteName.endsWith('rblx.data')) return packageBuffer;
          return null;
        },
        setStatus: t => {
          if (!t) { loadDiv.style.display = 'none'; return; }
          subTxt.textContent = t;
        },
        preRun: [() => {
          if (!customBytes) return;
          // Hook FS.createDataFile right when preRun executes (after rblx.js assigns it)
          const origCreate = Module.FS_createDataFile;
          Module.FS_createDataFile = function (parent, name, data, canRead, canWrite, canOwn) {
            if (parent === '/content/game.rbxl' || name === 'game.rbxl') {
              return origCreate.call(this, parent, name, customBytes.slice(), canRead, canWrite, false);
            }
            return origCreate.call(this, parent, name, data, canRead, canWrite, canOwn);
          };
        }],
        onRuntimeInitialized: () => {
          if (customBytes && typeof FS !== 'undefined') {
            try { FS.writeFile('/content/game.rbxl', customBytes); } catch (e) {}
          }
          loadDiv.style.display = 'none';
        }
      };

      const s = document.createElement('script');
      s.src = 'rblx.js';
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
